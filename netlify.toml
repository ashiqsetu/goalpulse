[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"
  autoLaunch = false

# SPA fallback so React Router routes work on hard refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
